<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harvey - Professional Class AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#080808',
                        subtext: '#a1a1aa',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Newsreader', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom adjustments for pixel perfection */
        body {
            background-color: #080808;
            color: white;
            -webkit-font-smoothing: antialiased;
        }
        .hero-serif {
            font-weight: 400;
            letter-spacing: -0.02em;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Top Banner -->
    <div class="w-full bg-[#080808] text-white text-[11px] py-2.5 flex justify-center items-center border-b border-white/5 tracking-wide">
        <a href="#" class="hover:text-gray-300 transition-colors flex items-center gap-1">
            2025 Year in Review Learn more <span class="text-[10px]">→</span>
        </a>
    </div>

    <!-- Navigation -->
    <nav class="w-full px-6 py-5 flex justify-between items-center max-w-[1600px] mx-auto">
        <!-- Logo -->
        <div class="flex-shrink-0">
            <a href="#" class="font-serif text-3xl tracking-tight text-white hover:opacity-90 transition-opacity">Harvey</a>
        </div>

        <!-- Menu Items (Desktop) -->
        <div class="hidden lg:flex items-center gap-8 text-[13px] font-medium text-gray-200">
            <div class="group relative cursor-pointer flex items-center gap-1 hover:text-white transition-colors">
                Platform
                <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="opacity-70"><path d="m6 9 6 6 6-6"/></svg>
            </div>
            <div class="group relative cursor-pointer flex items-center gap-1 hover:text-white transition-colors">
                Solutions
                <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="opacity-70"><path d="m6 9 6 6 6-6"/></svg>
            </div>
            <a href="#" class="hover:text-white transition-colors">Customers</a>
            <a href="#" class="hover:text-white transition-colors">Security</a>
            <div class="group relative cursor-pointer flex items-center gap-1 hover:text-white transition-colors">
                Resources
                <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="opacity-70"><path d="m6 9 6 6 6-6"/></svg>
            </div>
            <div class="group relative cursor-pointer flex items-center gap-1 hover:text-white transition-colors">
                About
                <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="opacity-70"><path d="m6 9 6 6 6-6"/></svg>
            </div>
        </div>

        <!-- Login -->
        <div class="flex-shrink-0">
            <a href="#" class="text-[13px] font-medium text-white hover:text-gray-300 transition-colors">Login</a>
        </div>
    </nav>

    <!-- Hero Section -->
    <main class="flex-grow flex flex-col items-center pt-24 w-full">
        
        <!-- Headline -->
        <h1 class="font-serif text-[3.5rem] md:text-[5rem] lg:text-[5.5rem] leading-[1.1] text-center text-white hero-serif mb-6">
            Professional<br>Class AI
        </h1>

        <!-- Subheadline -->
        <p class="text-subtext text-lg md:text-[1.15rem] leading-relaxed text-center max-w-xl mx-auto font-light mb-10 px-4">
            Domain-specific AI for law firms, professional<br class="hidden md:block"> service providers, and the Fortune 500.
        </p>

        <!-- CTA Button -->
        <button class="bg-white text-black px-6 py-3 rounded-[4px] text-[15px] font-medium hover:bg-gray-200 transition-colors mb-20">
            Request a Demo
        </button>

        <!-- Hero Image/Video Placeholder -->
        <div class="w-full max-w-[1400px] px-4 md:px-8 pb-10">
            <div class="relative w-full aspect-[16/7] overflow-hidden rounded-sm bg-[#1a1a1a]">
                <!-- Using a placeholder image that mimics the dark cinematic tone of the original -->
                <img 
                    src="https://placehold.co/1400x600/1a1a1a/333333?text=Video+Thumbnail" 
                    alt="Two professionals talking in an office setting" 
                    class="w-full h-full object-cover opacity-80"
                >
                <!-- Overlay to darken it slightly to match the vibe if needed -->
                <div class="absolute inset-0 bg-gradient-to-t from-black/20 to-transparent"></div>
            </div>
        </div>

    </main>

</body>
</html>
