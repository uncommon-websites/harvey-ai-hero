<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harvey - Practice Made Perfect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['Times New Roman', 'Times', 'serif'],
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            black: '#050505',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Animation keyframes */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
                filter: blur(4px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Base animation class - ease-out for entering elements */
        .animate-fade-in-up {
            opacity: 0;
            animation: fadeInUp 0.8s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
        }

        .animate-fade-in {
            opacity: 0;
            animation: fadeIn 0.8s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
        }

        .animate-scale-in {
            opacity: 0;
            animation: scaleIn 1s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
        }

        /* Staggered delays for sequential reveals */
        .delay-0 { animation-delay: 0ms; }
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-400 { animation-delay: 400ms; }
        .delay-500 { animation-delay: 500ms; }
        .delay-600 { animation-delay: 600ms; }
        .delay-700 { animation-delay: 700ms; }
        .delay-800 { animation-delay: 800ms; }

        /* Typography Utilities */
        .text-balance { text-wrap: balance; }
        .text-pretty { text-wrap: pretty; }

        /* Custom Scrollbar for logo section if needed */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @media (prefers-reduced-motion: reduce) {
            .animate-fade-in-up,
            .animate-fade-in,
            .animate-scale-in {
                animation: none;
                opacity: 1;
                transform: none;
                filter: none;
            }
        }
    </style>
</head>
<body class="bg-black text-white antialiased overflow-x-hidden">

    <!-- Main Hero Container -->
    <main class="relative w-full h-screen min-h-[700px] flex flex-col overflow-hidden">
        
        <!-- Background Image with Scale Animation -->
        <div class="absolute inset-0 z-0">
            <!-- Using a dark placeholder to simulate the moody office environment -->
            <img src="https://placehold.co/1920x1080/111111/333333?text=Meeting+Background" 
                 alt="Law firm meeting background" 
                 class="w-full h-full object-cover animate-scale-in origin-center opacity-80">
            
            <!-- Gradient Overlays for Readability -->
            <!-- Left-heavy gradient for text -->
            <div class="absolute inset-0 bg-gradient-to-r from-black/90 via-black/50 to-transparent z-10"></div>
            <!-- Bottom-heavy gradient for logos -->
            <div class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent z-10"></div>
        </div>

        <!-- Navigation -->
        <header class="relative z-50 w-full px-6 md:px-10 py-6 flex justify-between items-center animate-fade-in delay-0">
            <!-- Logo -->
            <div class="flex items-center">
                <a href="#" class="text-3xl md:text-4xl font-serif tracking-tight text-white hover:opacity-90 transition-opacity">
                    Harvey
                </a>
            </div>

            <!-- Desktop Nav Links -->
            <nav class="hidden lg:flex items-center gap-8 text-sm font-medium text-gray-200">
                <div class="group relative flex items-center gap-1 cursor-pointer hover:text-white transition-colors">
                    Platform
                    <svg class="w-3 h-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </div>
                <div class="group relative flex items-center gap-1 cursor-pointer hover:text-white transition-colors">
                    Solutions
                    <svg class="w-3 h-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </div>
                <a href="#" class="hover:text-white transition-colors">Customers</a>
                <a href="#" class="hover:text-white transition-colors">Security</a>
                <div class="group relative flex items-center gap-1 cursor-pointer hover:text-white transition-colors">
                    Resources
                    <svg class="w-3 h-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </div>
                <div class="group relative flex items-center gap-1 cursor-pointer hover:text-white transition-colors">
                    About
                    <svg class="w-3 h-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </div>
            </nav>

            <!-- Login / Mobile Menu -->
            <div class="flex items-center gap-4">
                <a href="#" class="text-sm font-medium text-white hover:text-gray-300 transition-colors">Login</a>
                <!-- Mobile Menu Icon (Hidden on Desktop) -->
                <button class="lg:hidden text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
            </div>
        </header>

        <!-- Hero Content -->
        <div class="relative z-40 flex-grow flex flex-col justify-center px-6 md:px-10 pb-20">
            <div class="max-w-4xl">
                <!-- Headline -->
                <h1 class="font-serif text-5xl sm:text-6xl md:text-7xl lg:text-[5.5rem] leading-[1.1] tracking-tight text-white mb-6 text-balance animate-fade-in-up delay-100">
                    Practice Made Perfect
                </h1>
                
                <!-- Subheadline -->
                <p class="text-lg md:text-xl text-gray-200 leading-relaxed max-w-2xl text-pretty mb-10 animate-fade-in-up delay-200 font-light">
                    Today's top law firms and in-house legal teams trust Harvey to elevate their craft and navigate complexity.
                </p>
                
                <!-- CTA Button -->
                <div class="animate-fade-in-up delay-300">
                    <a href="#" class="inline-block bg-white text-black font-medium px-8 py-3.5 rounded text-sm hover:bg-gray-100 transition-colors duration-300">
                        Request a Demo
                    </a>
                </div>
            </div>
        </div>

        <!-- Footer / Logos Section -->
        <div class="relative z-40 w-full px-6 md:px-10 pb-8 md:pb-12 animate-fade-in delay-500">
            <div class="flex flex-col xl:flex-row items-end justify-between gap-8">
                
                <!-- Client Logos -->
                <div class="w-full xl:w-auto overflow-x-auto no-scrollbar mask-linear-fade">
                    <div class="flex items-center gap-8 md:gap-12 min-w-max opacity-80 grayscale hover:grayscale-0 transition-all duration-500">
                        <!-- O'Melveny -->
                        <img src="https://placehold.co/120x30/000000/FFFFFF?text=O'Melveny" alt="O'Melveny" class="h-6 md:h-7 w-auto object-contain">
                        
                        <!-- Bridgewater -->
                        <img src="https://placehold.co/140x30/000000/FFFFFF?text=BRIDGEWATER" alt="Bridgewater" class="h-5 md:h-6 w-auto object-contain">
                        
                        <!-- Macfarlanes -->
                        <img src="https://placehold.co/150x30/000000/FFFFFF?text=MACFARLANES" alt="Macfarlanes" class="h-5 md:h-6 w-auto object-contain">
                        
                        <!-- KKR -->
                        <img src="https://placehold.co/80x30/000000/FFFFFF?text=KKR" alt="KKR" class="h-5 md:h-6 w-auto object-contain">
                        
                        <!-- A&O Shearman -->
                        <img src="https://placehold.co/160x30/000000/FFFFFF?text=A%26O+SHEARMAN" alt="A&O Shearman" class="h-5 md:h-6 w-auto object-contain">
                        
                        <!-- Gleiss Lutz -->
                        <img src="https://placehold.co/120x30/000000/FFFFFF?text=Gleiss+Lutz" alt="Gleiss Lutz" class="h-6 md:h-7 w-auto object-contain">
                        
                        <!-- CMS -->
                        <div class="flex flex-col items-center">
                            <img src="https://placehold.co/60x25/000000/FFFFFF?text=CMS" alt="CMS" class="h-6 w-auto object-contain">
                        </div>

                        <!-- Cuatrecasas -->
                        <div class="flex flex-col items-center">
                            <img src="https://placehold.co/120x30/000000/FFFFFF?text=CUATRECASAS" alt="Cuatrecasas" class="h-6 w-auto object-contain">
                        </div>

                        <!-- Thompson Hine -->
                        <img src="https://placehold.co/120x40/000000/FFFFFF?text=THOMPSON%0AHINE" alt="Thompson Hine" class="h-8 w-auto object-contain">
                    </div>
                </div>

                <!-- Our Customers Button -->
                <div class="hidden md:block shrink-0">
                    <a href="#" class="inline-block border border-white/30 text-white px-6 py-2.5 rounded text-xs uppercase tracking-wide hover:bg-white/10 transition-colors duration-300">
                        Our Customers
                    </a>
                </div>
            </div>
        </div>

    </main>

</body>
</html>
